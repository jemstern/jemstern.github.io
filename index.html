<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jem Stern</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; color: #000; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; }
    main { position: relative; min-height: 3100px; }
    h1 { position: absolute; top: 22px; left: 24px; margin: 0; font: inherit; font-weight: 400; }
    img { position: absolute; display: block; height: auto; }
    .one { width: 220px; top: 330px; left: 62%; }
    .two { width: 180px; top: 1220px; left: 16%; }
    .three { width: 300px; top: 2180px; left: 55%; }
    @media (max-width: 700px) {
      main { min-height: 2350px; }
      h1 { top: 16px; left: 16px; }
      .one { width: 38vw; top: 270px; left: 52%; }
      .two { width: 34vw; top: 980px; left: 10%; }
      .three { width: 48vw; top: 1660px; left: 43%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Jem Stern</h1>
    <img class="one" src="elite-gourmet.jpg" alt="Artwork by Jem Stern">
    <img class="two" src="img-0067.jpeg" alt="Artwork by Jem Stern">
    <img class="three" src="wolf.jpg" alt="Artwork by Jem Stern">
  </main>
</body>
</html>
